[project]
name = "aws-recipe-capstone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.81",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "mangum>=0.22.0",
    "python-multipart>=0.0.32",
    "starlette>=0.41,<0.48",
    "uvicorn>=0.52.4",
]

[project.scripts]
aws-recipe-capstone = "aws_recipe_capstone:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
